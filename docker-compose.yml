name: zabbix

services:
  mysql:
    image: mysql:8.0
    container_name: zabbix-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [zabbix]

  zabbix-server:
    image: zabbix/zabbix-server-mysql:${ZABBIX_VERSION:-7.0-alpine-latest}
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-64M}
      ZBX_STARTPOLLERS: ${ZBX_STARTPOLLERS:-5}
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - server-alertscripts:/usr/lib/zabbix/alertscripts
      - server-externalscripts:/usr/lib/zabbix/externalscripts
      - server-export:/var/lib/zabbix/export
    networks: [zabbix]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:${ZABBIX_VERSION:-7.0-alpine-latest}
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zabbix}
      MYSQL_USER: ${MYSQL_USER:-zabbix}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PHP_TZ: ${PHP_TZ:-UTC}
    ports:
      - "${ZABBIX_WEB_PORT:-8080}:8080"
    networks: [zabbix]

  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZABBIX_VERSION:-7.0-alpine-latest}
    container_name: zabbix-agent
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
    environment:
      ZBX_HOSTNAME: ${ZBX_AGENT_HOSTNAME:-Zabbix server}
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
    privileged: true
    pid: "host"
    networks: [zabbix]

networks:
  zabbix:
    driver: bridge

volumes:
  mysql-data:
  server-alertscripts:
  server-externalscripts:
  server-export:
