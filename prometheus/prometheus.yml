global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # eventsim joins this stack's docker network (prometheus_prometheus) so it
  # can be scraped by container name. Deploy eventsim after this stack.
  - job_name: eventsim
    static_configs:
      - targets: ["eventsim-server:8090"]

  - job_name: platform
    static_configs:
      - targets: ["monitoring-platform:8100"]

  - job_name: notifications
    static_configs:
      - targets: ["notifications-server:8110"]
