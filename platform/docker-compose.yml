name: platform

services:
  server:
    build: .
    container_name: monitoring-platform
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-eventsim-kafka:9092}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-monitoring.events.v1}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-monitoring.alerts.v1}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-platform-ingestion-v1}
      KAFKA_AI_REQUESTS_TOPIC: ${KAFKA_AI_REQUESTS_TOPIC:-monitoring.ai.enrichment.v1}
      KAFKA_AI_RESULTS_TOPIC: ${KAFKA_AI_RESULTS_TOPIC:-monitoring.ai.results.v1}
      PLATFORM_HISTORY_LIMIT: ${PLATFORM_HISTORY_LIMIT:-500}
      ZABBIX_API_URL: ${ZABBIX_API_URL:-http://zabbix-web:8080/api_jsonrpc.php}
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN:-}
      ZABBIX_RECONCILE_INTERVAL: ${ZABBIX_RECONCILE_INTERVAL:-60}
    ports:
      - "${PLATFORM_PORT:-8100}:8100"
    networks: [eventsim, prometheus, zabbix]

networks:
  eventsim:
    name: eventsim_eventsim
    external: true
  prometheus:
    name: prometheus_prometheus
    external: true
  zabbix:
    name: zabbix_zabbix
    external: true
