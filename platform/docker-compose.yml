name: platform

services:
  server:
    build: .
    container_name: monitoring-platform
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-eventsim-kafka:9092}
      KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-monitoring.events.v1}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-monitoring.alerts.v1}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-platform-ingestion-v1}
      KAFKA_AI_REQUESTS_TOPIC: ${KAFKA_AI_REQUESTS_TOPIC:-monitoring.ai.enrichment.v1}
      KAFKA_AI_RESULTS_TOPIC: ${KAFKA_AI_RESULTS_TOPIC:-monitoring.ai.results.v1}
      PLATFORM_HISTORY_LIMIT: ${PLATFORM_HISTORY_LIMIT:-500}
      ZABBIX_API_URL: ${ZABBIX_API_URL:-http://zabbix-web:8080/api_jsonrpc.php}
      ZABBIX_API_TOKEN: ${ZABBIX_API_TOKEN:-}
      ZABBIX_RECONCILE_INTERVAL: ${ZABBIX_RECONCILE_INTERVAL:-60}
      TIMESCALE_EVENT_RETENTION_DAYS: ${TIMESCALE_EVENT_RETENTION_DAYS:-90}
      TIMESCALE_ALERT_RETENTION_DAYS: ${TIMESCALE_ALERT_RETENTION_DAYS:-90}
      TIMESCALE_DECISION_RETENTION_DAYS: ${TIMESCALE_DECISION_RETENTION_DAYS:-400}
      RATE_LIMIT_WEBHOOK_CAPACITY: ${RATE_LIMIT_WEBHOOK_CAPACITY:-60}
      RATE_LIMIT_WEBHOOK_REFILL_PER_SECOND: ${RATE_LIMIT_WEBHOOK_REFILL_PER_SECOND:-5}
      RATE_LIMIT_API_CAPACITY: ${RATE_LIMIT_API_CAPACITY:-120}
      RATE_LIMIT_API_REFILL_PER_SECOND: ${RATE_LIMIT_API_REFILL_PER_SECOND:-20}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-}
      TRUECONF_BASE_URL: ${TRUECONF_BASE_URL:-}
      TRUECONF_VERIFY_SSL: ${TRUECONF_VERIFY_SSL:-true}
      TRUECONF_OAUTH_CLIENT_ID: ${TRUECONF_OAUTH_CLIENT_ID:-}
      TRUECONF_OAUTH_CLIENT_SECRET: ${TRUECONF_OAUTH_CLIENT_SECRET:-}
      TRUECONF_OAUTH_REDIRECT_URI: ${TRUECONF_OAUTH_REDIRECT_URI:-}
      TRUECONF_USERINFO_PATH: ${TRUECONF_USERINFO_PATH:-/api/v4/users/self}
      TRUECONF_USERINFO_SUBJECT_FIELD: ${TRUECONF_USERINFO_SUBJECT_FIELD:-id}
      TRUECONF_USERINFO_DISPLAY_FIELD: ${TRUECONF_USERINFO_DISPLAY_FIELD:-displayName}
      AUTH_RETURN_TO_ALLOWLIST: ${AUTH_RETURN_TO_ALLOWLIST:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    ports:
      - "${PLATFORM_PORT:-8100}:8100"
    networks: [eventsim, prometheus, zabbix, timescaledb, platform]

networks:
  eventsim:
    name: eventsim_eventsim
    external: true
  prometheus:
    name: prometheus_prometheus
    external: true
  zabbix:
    name: zabbix_zabbix
    external: true
  timescaledb:
    name: timescaledb_timescaledb
    external: true
  # This stack's own network -- so other stacks (frontend/) can reach
  # monitoring-platform by container name, same convention as the four
  # external networks above but owned here instead of joined from here.
  platform:
    name: platform_platform
