<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- app.js:605 writes this on every theme switch and throws if it's absent,
     which would abort bootstrap() before anything renders. -->
<meta name="theme-color" content="#f8fafc">
<title>Спокуха — управление инцидентами</title>
<link rel="icon" href="/assets/spokukha-logo.png">
<link rel="stylesheet" href="/app.css">
<script>
  // Ahead of app.css so a dark-theme user doesn't get a white flash before
  // applyTheme() runs. Same key app.js persists to.
  document.documentElement.dataset.theme = localStorage.getItem('spokukha-theme') || 'light';
</script>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><img src="/assets/spokukha-logo.png" alt=""><span>Спокуха</span></div>
  <div class="nav-eyebrow" id="nav-eyebrow"></div>
  <nav class="main-nav" id="main-nav" aria-label="Разделы"></nav>
  <div class="sidebar-footer">
    <div class="connection">
      <span class="status-dot" id="connection-dot"></span>
      <span id="connection-label">Проверка связи…</span>
    </div>
    <button class="theme-button" id="theme-button" type="button">Тёмная тема</button>
  </div>
</aside>

<header class="topbar">
  <button class="menu-button" id="menu-button" type="button" aria-label="Меню" aria-controls="sidebar">☰</button>
  <div class="global-search">
    <label class="sr-only" for="global-search">Поиск по разделу</label>
    <input id="global-search" type="search" placeholder="Поиск по разделу" autocomplete="off">
  </div>
  <div class="account">
    <span class="account-meta" id="account-meta"></span>
    <a id="auth-link" href="/v1/auth/login">Войти</a>
  </div>
</header>

<main class="content" id="content"></main>

<div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

<!-- defer: app.js resolves #content/#main-nav/#global-search and binds
     #theme-button/#menu-button at top level, so the shell above must exist
     before it runs. -->
<script src="/app.js" defer></script>
</body>
</html>
