name: active-directory

services:
  samba-ad-dc:
    image: nowsci/samba-domain:${SAMBA_DOMAIN_VERSION:-latest}
    container_name: samba-ad-dc
    restart: unless-stopped
    environment:
      DOMAIN: ${AD_DOMAIN:-PILOT.INTERNAL}
      DOMAINPASS: ${AD_ADMIN_PASSWORD}
      HOSTIP: ${AD_HOST_IP:-10.90.0.10}
      NOCOMPLEXITY: "true"
      INSECURELDAP: "true"
    hostname: samba-ad-dc
    # Required by the image itself (see its Docker Hub docs) -- Samba's AD
    # DC provisioning sets NT ACLs/xattrs on sysvol that plain cap_add
    # doesn't cover; without this it crash-loops on provisioning with
    # "set_nt_acl_no_snum: ... NT_STATUS_ACCESS_DENIED" (confirmed by
    # actually deploying this stack for the first time). No host ports are
    # published and this network is otherwise isolated (see README), which
    # bounds the exposure, but this is still a real privilege escalation
    # worth knowing is here, not something to wave past.
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - samba-data:/var/lib/samba
      - samba-config:/etc/samba/external
    networks:
      active-directory:
        ipv4_address: ${AD_HOST_IP:-10.90.0.10}

networks:
  active-directory:
    name: active-directory_active-directory
    ipam:
      config:
        - subnet: 10.90.0.0/24

volumes:
  samba-data:
  samba-config:
