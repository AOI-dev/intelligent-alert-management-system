[project]
name = "trueconf-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-trueconf-bot>=1.4,<2",
    # The incident-delivery adapter (POST /v1/notify) that the notifications
    # dispatcher calls. See app/main.py's docstring for why this is a webhook
    # rather than a second Kafka consumer.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # Used directly for the credentials token fetch in app/main.py. It already
    # arrives via python-trueconf-bot, but declaring it makes that an
    # intentional dependency rather than one this code happens to inherit.
    "httpx>=0.27",
]
