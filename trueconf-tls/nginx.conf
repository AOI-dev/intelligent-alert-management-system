# The frontend, on HTTPS. Not about protecting the frontend's own traffic
# (it's the same self-signed cert as everything else here) but about the
# login flow having one scheme end to end. Browsers compute "same site"
# schemefully, so a page on http://…:8091 and the OAuth2 callback on
# https://…:8443 are *cross*-site despite being the same host, and the
# SameSite=Lax state cookie platform sets during /v1/auth/login then
# doesn't come back on the callback. Served from https://…:8543 the whole
# chain is one scheme, and the cookie travels.
server {
    listen 8543 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    resolver 127.0.0.11 valid=10s;

    location / {
        # The frontend's own nginx, which already reverse-proxies /v1/ to
        # monitoring-platform -- so this stays a plain pass-through and
        # everything the browser touches stays on this one origin.
        set $frontend monitoring-frontend:80;
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    # Docker's embedded DNS (127.0.0.11, available on any user-defined
    # bridge network -- see this stack's own network in docker-compose.yml,
    # which trueconf-server joins via `docker network connect` after this
    # stack starts, see README.md). Combined with `set $upstream` below,
    # this resolves trueconf-server per-request instead of once at nginx
    # startup -- without it, nginx refuses to start at all if
    # trueconf-server isn't already on this network yet (same issue this
    # exact pattern already fixed once, in frontend/nginx.conf.template).
    resolver 127.0.0.11 valid=10s;

    # platform's OAuth2 callback, served from *this* origin rather than
    # its own http://…:8100. Not cosmetic: TrueConf's login SPA finishes
    # the flow with an XHR whose redirect chain ends at redirect_uri, and
    # reads `response.request.responseURL` to learn the code. A plain-HTTP
    # redirect_uri makes that a mixed-content request, which the browser
    # kills before it leaves the page -- the SPA then hits its
    # `if (!response)` branch and bounces the browser to the bare
    # redirect_uri with no code and no state at all. Same scheme, host and
    # port as the login page is what keeps that XHR alive.
    location = /v1/auth/callback {
        set $platform monitoring-platform:8100;
        proxy_pass http://$platform;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # :8081, not :80 -- trueconf-server's public :80 vhost overwrites
        # X-Forwarded-SSL with its own (plain-HTTP) view of the
        # connection, which makes TrueConf's OAuth2 credentials API
        # answer {"reason":"insecureConnection"} no matter how solid the
        # TLS out here is. :8081 is a private vhost installed by
        # ./install-tcs-vhost.sh that reports the TLS this proxy really
        # terminates. See tcs/xforwarded-ssl-vhost.conf.
        set $upstream trueconf-server:8081;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http:// https://;
    }
}
