server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    # Docker's embedded DNS (127.0.0.11, available on any user-defined
    # bridge network -- see this stack's own network in docker-compose.yml,
    # which trueconf-server joins via `docker network connect` after this
    # stack starts, see README.md). Combined with `set $upstream` below,
    # this resolves trueconf-server per-request instead of once at nginx
    # startup -- without it, nginx refuses to start at all if
    # trueconf-server isn't already on this network yet (same issue this
    # exact pattern already fixed once, in frontend/nginx.conf.template).
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream trueconf-server:80;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http:// https://;
    }
}
