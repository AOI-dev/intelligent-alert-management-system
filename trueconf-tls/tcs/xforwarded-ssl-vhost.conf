# Installed into the *running* trueconf-server container at
# /opt/trueconf/server/opt2/xforwarded-ssl-vhost.conf by
# ../install-tcs-vhost.sh -- see this stack's README.md ("The API layer
# needs its own telling") for why this exists and why it can't be a bind
# mount.
#
# What it is: a copy of TrueConf's own catch-all front-end vhost
# (etc/webmanager/extra/httpd-vhosts.conf's <VirtualHost *:*>) on a
# private port, differing in exactly one way -- it reports the request as
# TLS-terminated instead of deriving that from its own listener.
#
# Why: TrueConf's Go manager rejects POST /api/v4/oauth2/auth (the
# credentials step of the OAuth2 login SPA) with
# {"reason":"insecureConnection"} unless it sees X-Forwarded-SSL: on.
# Confirmed by hand against the manager on 127.0.0.1:1337 -- that one
# header is the difference between "insecureConnection" and normal field
# validation; X-Forwarded-Proto/X-Forwarded-Protocol/X-Url-Scheme are all
# ignored for this check. TLS at our nginx alone can't deliver it: the
# vhost this file copies does
#     RequestHeader set "X-Forwarded-SSL" expr=%{HTTPS}
# which unconditionally overwrites whatever the front proxy sent with
# apache's own (plain-HTTP, so "off") notion of the connection.
#
# Port 8081 is deliberately NOT published on the host -- only containers
# on trueconf-tls's docker network can reach it, i.e. this stack's nginx,
# which really does terminate TLS. The public plain-HTTP :80 vhost is
# untouched and still reports itself insecure, so this doesn't let an
# outside caller skip TrueConf's check by asserting a header.
#
# Included via httpd.conf's trailing `IncludeOptional opt2/*.conf`, not
# etc/webmanager/opt/ -- the earlier include runs before
# extra/httpd-defines.conf, so ${root_dir} and friends below wouldn't be
# defined yet.

Listen 8081

<VirtualHost *:8081>
    DocumentRoot "${root_dir}"
    ServerName localhost

    AllowEncodedSlashes NoDecode

    Include etc/webmanager/extra/alias.conf

    <Directory />
        AllowOverride All
    </Directory>

    RewriteEngine On
    RewriteOptions Inherit

    # The one and only deviation from TrueConf's own vhost: these two are
    # `expr=%{REQUEST_SCHEME}` / `expr=%{HTTPS}` there. TLS is terminated
    # by this stack's nginx, one hop in front, so the truthful value for
    # the client-facing connection is fixed, not whatever this listener
    # happens to be.
    RequestHeader set "X-Forwarded-Proto" "https"
    RequestHeader set "X-Forwarded-SSL" "on"
    RequestHeader set "X-Forwarded-Port" "8443"
    RequestHeader set "X-Forwarded-TC-Manager-Url" expr=${tc_manager_address}
    RequestHeader set "X-Forwarded-TC-Server-Url" expr=${tc_server_address}

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/ nocanon
    ProxyPassReverse / http://127.0.0.1:8080/

    LimitRequestLine 32768
    LimitRequestFieldSize 32768
</VirtualHost>
